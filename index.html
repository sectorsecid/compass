<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembuat Set Vektor Otomatis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF0F7;--panel:#fff;--ink:#1B1F3B;--muted:#5d6385;--line:#d3d7e8;--accent:#2433D6;--onaccent:#fff;--tile:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1120;--panel:#181B33;--ink:#EDEEF8;--muted:#9aa0c8;--line:#2c3058;--accent:#8FA2FF;--onaccent:#0F1120;--tile:#181B33}}
:root[data-theme="dark"]{--bg:#0F1120;--panel:#181B33;--ink:#EDEEF8;--muted:#9aa0c8;--line:#2c3058;--accent:#8FA2FF;--onaccent:#0F1120;--tile:#181B33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.025em}
.sub{margin:0;color:var(--muted);max-width:52ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:16px;align-content:start}
.field{display:grid;gap:8px}
.field>span,.lab{font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.lab b{font-weight:400;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pals button{border:2px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;height:36px;cursor:pointer;background:none}
.pals button[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.pals i{flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;min-height:40px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.chk input{accent-color:var(--accent);width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
.out{display:grid;gap:12px;align-content:start;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.bar p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{padding:0;border:1px solid var(--line);background:var(--tile);border-radius:14px;cursor:pointer;aspect-ratio:1;display:block;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile svg{display:block;width:100%;height:100%}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
@media (min-width:820px){.app{grid-template-columns:300px 1fr;padding-top:36px}header{grid-column:1/-1}.panel{position:sticky;top:16px}}
@media (prefers-reduced-motion:reduce){.tile,#toast{transition:none}}
</style>
</head>
<body>
<main class="app">
<header>
<h1>Set vektor otomatis</h1>
<p class="sub">Atur gaya dan palet, set SVG baru langsung tersusun. Unduh satu per satu atau satu set penuh.</p>
</header>

<section class="panel" aria-label="Pengaturan">
<div class="field"><span>Gaya</span>
<div class="seg" id="styles"></div></div>
<div class="field"><span>Palet</span><div class="pals" id="pals"></div></div>
<label class="field"><span class="lab">Jumlah <b id="nv"></b></span><input type="range" id="n" min="4" max="36" value="12"></label>
<label class="field"><span class="lab">Tebal garis <b id="sv"></b></span><input type="range" id="sw" min="2" max="9" value="4"></label>
<label class="chk"><input type="checkbox" id="bg" checked>Pakai latar warna</label>
<div class="field"><span>Seed</span>
<div class="row"><input type="text" id="seed" value="bintang" aria-label="Seed"><button class="btn" id="rand">Acak ulang</button></div></div>
</section>

<section class="out" aria-label="Hasil">
<div class="bar"><p id="info"></p><button class="btn primary" id="all">Unduh set (SVG)</button></div>
<div class="grid" id="grid"></div>
</section>
</main>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const PAL=[
["Senja",["#2B1B3D","#FF6B6B","#FFB347","#FFE66D","#8E7CC3"]],
["Laut",["#0B2545","#13A8A8","#8DDBE0","#EEF4ED","#F25F5C"]],
["Hutan",["#14301F","#6FB36B","#E9D758","#F2E9DC","#D1603D"]],
["Permen",["#FFF1F5","#FF5D8F","#5B8DEF","#FFC857","#3DDC97"]],
["Mono",["#111111","#FFFFFF","#BDBDBD","#7A7A7A","#E8E8E8"]],
["Kobalt",["#EDEFFA","#2433D6","#FF4F2E","#1B1F3B","#8FA2FF"]]];
const STY=[["geo","Geometris"],["org","Organik"],["line","Garis"],["pat","Pola"],["mix","Campur"]];
const st={style:"geo",pal:0,n:12,sw:4,bg:true,seed:"bintang"};
const f=x=>+x.toFixed(1);
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pk=(r,c)=>c[1+Math.floor(r()*(c.length-1))];
const A=(col,sw)=>`fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;

function blob(r,cx,cy,R,col){
  const n=6+Math.floor(r()*3),P=[];
  for(let i=0;i<n;i++){const a=i/n*6.2832,d=R*(.65+r()*.45);P.push([cx+Math.cos(a)*d,cy+Math.sin(a)*d])}
  let d=`M${f(P[0][0])} ${f(P[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return `<path d="${d}Z" fill="${col}"/>`;
}

const G={
geo(r,c){
  const k=2+Math.floor(r()*3);let o="";
  for(let i=0;i<k;i++){
    const col=pk(r,c),t=Math.floor(r()*6),x=20+r()*60,y=20+r()*60,s=14+r()*26;
    if(t==0)o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(s)}" fill="${col}"/>`;
    else if(t==1)o+=`<rect x="${f(x-s)}" y="${f(y-s)}" width="${f(s*2)}" height="${f(s*(1+r()))}" rx="${f(r()*s/2)}" fill="${col}"/>`;
    else if(t==2)o+=`<path d="M${f(x)} ${f(y-s)}L${f(x+s)} ${f(y+s)}L${f(x-s)} ${f(y+s)}Z" fill="${col}"/>`;
    else if(t==3)o+=`<path d="M${f(x-s)} ${f(y)}a${f(s)} ${f(s)} 0 0 1 ${f(s*2)} 0Z" fill="${col}"/>`;
    else if(t==4)o+=`<circle cx="${f(x)}" cy="${f(y)}" r="${f(s*.8)}" fill="none" stroke="${col}" stroke-width="${f(s/2.2)}"/>`;
    else o+=`<path d="M${f(x)} ${f(y-s)}L${f(x+s)} ${f(y)}L${f(x)} ${f(y+s)}L${f(x-s)} ${f(y)}Z" fill="${col}"/>`;
  }
  return o;
},
org(r,c){
  let o=blob(r,50,50,34,pk(r,c));
  const k=1+Math.floor(r()*2);
  for(let i=0;i<k;i++)o+=blob(r,25+r()*50,25+r()*50,10+r()*14,pk(r,c));
  return o;
},
line(r,c,sw){
  const col=pk(r,c),col2=pk(r,c),t=Math.floor(r()*4);let o="";
  if(t==0){const k=3+Math.floor(r()*2);
    for(let i=1;i<=k;i++)o+=`<circle cx="50" cy="50" r="${f(i*40/k)}" ${A(i%2?col:col2,sw)}/>`;}
  else if(t==1){const k=4,amp=6+r()*12;
    for(let i=0;i<k;i++){const y=20+i*20;o+=`<path d="M8 ${y}Q29 ${f(y-amp)} 50 ${y}T92 ${y}" ${A(i%2?col:col2,sw)}/>`;}}
  else if(t==2){
    for(let j=0;j<2;j++){let d="";for(let i=0;i<6;i++)d+=`${i?"L":"M"}${10+i*16} ${j?66+(i%2?-14:0):34+(i%2?14:0)}`;
      o+=`<path d="${d}" ${A(j?col2:col,sw)}/>`;}}
  else{const n=6+Math.floor(r()*5);
    for(let i=0;i<n;i++){const a=i/n*6.2832,ca=Math.cos(a),sa=Math.sin(a);
      o+=`<path d="M${f(50+ca*14)} ${f(50+sa*14)}L${f(50+ca*40)} ${f(50+sa*40)}" ${A(i%2?col:col2,sw)}/>`;}}
  return o;
},
pat(r,c,sw){
  const col=pk(r,c),col2=pk(r,c),t=Math.floor(r()*3);let o="";
  if(t==0){
    for(let y=0;y<5;y++)for(let x=0;x<5;x++)o+=`<circle cx="${10+x*20}" cy="${10+y*20}" r="${f(2+r()*6)}" fill="${(x+y)%2?col:col2}"/>`;}
  else if(t==1){
    for(let y=0;y<4;y++)for(let x=0;x<4;x++){
      const ox=x*25,oy=y*25,fl=r()<.5,a=`a12.5 12.5 0 0 `;
      o+=fl?`<path d="M${ox+12.5} ${oy}${a}1 -12.5 12.5M${ox+25} ${oy+12.5}${a}0 -12.5 12.5" ${A(col,sw)}/>`
            :`<path d="M${ox+12.5} ${oy}${a}0 12.5 12.5M${ox} ${oy+12.5}${a}1 12.5 12.5" ${A(col,sw)}/>`;}}
  else{
    for(let i=0;i<8;i++){const x=i*16-20;o+=`<path d="M${x} 100L${x+100} 0" ${A(i%2?col:col2,sw*1.6)}/>`;}}
  return o;
}};

function inner(i){
  const r=rng(hash(st.seed)+i*7919),c=PAL[st.pal][1];
  let s=st.style;
  if(s=="mix")s=["geo","org","line","pat"][Math.floor(r()*4)];
  return (st.bg?`<rect width="100" height="100" rx="14" fill="${c[0]}"/>`:"")+G[s](r,c,st.sw);
}
const one=i=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">${inner(i)}</svg>`;
function sheet(){
  const cols=Math.min(st.n,6),rows=Math.ceil(st.n/cols),W=cols*108-8,H=rows*108-8;
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W*4}" height="${H*4}">`;
  for(let i=0;i<st.n;i++)o+=`<svg x="${(i%cols)*108}" y="${Math.floor(i/cols)*108}" width="100" height="100" viewBox="0 0 100 100">${inner(i)}</svg>`;
  return o+"</svg>";
}

function render(){
  $("#nv").textContent=st.n;$("#sv").textContent=st.sw;
  let h="";
  for(let i=0;i<st.n;i++)h+=`<button class="tile" data-i="${i}" aria-label="Unduh vektor ${i+1}" title="Klik untuk unduh"><svg viewBox="0 0 100 100">${inner(i)}</svg></button>`;
  $("#grid").innerHTML=h;
  $("#info").textContent=`${st.n} vektor. Klik satu kotak untuk mengunduhnya.`;
}

let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
let dlp;
const dl=()=>dlp||(dlp=(window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null)).catch(()=>null));
async function save(name,data){
  const d=await dl();
  if(!d){toast("Unduhan tidak tersedia di tampilan ini");return}
  try{await d.save({filename:name,data});toast("Tersimpan: "+name)}
  catch(e){if(!e||e.code!=="declined")toast("Gagal mengunduh ("+((e&&e.code)||"error")+")")}
}

// kontrol
$("#styles").innerHTML=STY.map(([k,l])=>`<button data-s="${k}" aria-pressed="${k==st.style}">${l}</button>`).join("");
$("#pals").innerHTML=PAL.map(([n,c],i)=>`<button data-p="${i}" title="${n}" aria-label="Palet ${n}" aria-pressed="${i==st.pal}">${c.map(x=>`<i style="background:${x}"></i>`).join("")}</button>`).join("");
$("#styles").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.style=b.dataset.s;
  document.querySelectorAll("#styles button").forEach(x=>x.setAttribute("aria-pressed",x==b));render()};
$("#pals").onclick=e=>{const b=e.target.closest("button");if(!b)return;st.pal=+b.dataset.p;
  document.querySelectorAll("#pals button").forEach(x=>x.setAttribute("aria-pressed",x==b));render()};
$("#n").oninput=e=>{st.n=+e.target.value;render()};
$("#sw").oninput=e=>{st.sw=+e.target.value;render()};
$("#bg").onchange=e=>{st.bg=e.target.checked;render()};
$("#seed").oninput=e=>{st.seed=e.target.value||"0";render()};
$("#rand").onclick=()=>{st.seed=Math.random().toString(36).slice(2,8);$("#seed").value=st.seed;render()};
$("#grid").onclick=e=>{const b=e.target.closest(".tile");if(b)save(`vektor-${+b.dataset.i+1}.svg`,one(+b.dataset.i))};
$("#all").onclick=()=>save("set-vektor.svg",sheet());
render();
</script>
</body>
</html>
